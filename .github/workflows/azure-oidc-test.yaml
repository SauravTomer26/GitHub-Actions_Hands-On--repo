name: Azure OIDC Test

on:
  workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  azure-login-test:
    runs-on: self-hosted

    steps:
      - name: STEP-1 - Checkout repository
        uses: actions/checkout@v4

      - name: STEP-2 - Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: STEP-3 - Verify Azure Login
        run: az account show 